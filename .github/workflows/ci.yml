name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore .\XISFLib.Net.slnx
      - run: dotnet build .\XISFLib.Net.slnx -c Release --no-restore
      - run: dotnet test .\XISFLib.Tests\XISFLib.Tests.csproj -c Release --no-build
      - run: dotnet test .\XISFLib.Windows.Tests\XISFLib.Windows.Tests.csproj -c Release --no-build
      - run: dotnet test .\XISFLib.Viewer.Core.Tests\XISFLib.Viewer.Core.Tests.csproj -c Release --no-build
      - run: dotnet test .\XISFLib.AvaloniaViewer.Tests\XISFLib.AvaloniaViewer.Tests.csproj -c Release --no-build
      - run: dotnet pack .\XISFLib\XISFLib.csproj -c Release --no-build --output .\artifacts
      - run: dotnet list .\XISFLib.Net.slnx package --vulnerable --include-transitive
      - name: Publish standalone WPF viewer
        run: dotnet publish .\XISFLib.WpfViewer\XISFLib.WpfViewer.csproj -c Release -p:PublishProfile=WinX64
      - name: Verify single executable
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\artifacts\wpf\win-x64 -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'XISFLib.WpfViewer.exe') {
            throw 'The WPF publish output must contain exactly XISFLib.WpfViewer.exe.'
          }
      - name: Upload standalone WPF viewer
        uses: actions/upload-artifact@v4
        with:
          name: wpf-viewer-win-x64
          path: artifacts/wpf/win-x64/XISFLib.WpfViewer.exe
          if-no-files-found: error
      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.81.0
      - name: Build documentation
        run: docfx docfx.json --warningsAsErrors
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_site
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts\*.*nupkg

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download standalone WPF viewer
        uses: actions/download-artifact@v4
        with:
          name: wpf-viewer-win-x64
          path: release
      - name: Create release and upload executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset="release/XISFLib.WpfViewer.exe"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
          fi

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
