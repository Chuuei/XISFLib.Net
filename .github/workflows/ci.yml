name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore .\XISFLib.Net.slnx
      - run: dotnet build .\XISFLib.Net.slnx -c Release --no-restore
      - run: dotnet test .\XISFLib.Tests\XISFLib.Tests.csproj -c Release --no-build
      - run: dotnet test .\XISFLib.Windows.Tests\XISFLib.Windows.Tests.csproj -c Release --no-build
      - run: dotnet pack .\XISFLib\XISFLib.csproj -c Release --no-build --output .\artifacts
      - run: dotnet list .\XISFLib.Net.slnx package --vulnerable --include-transitive
      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.81.0
      - name: Build documentation
        run: docfx docfx.json --warningsAsErrors
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_site
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts\*.*nupkg

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
