name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore .\XISFLib.Net.slnx
      - run: dotnet build .\XISFLib.Net.slnx -c Release --no-restore
      - run: dotnet test .\XISFLib.Tests\XISFLib.Tests.csproj -c Release --no-build
      - run: dotnet test .\XISFLib.Windows.Tests\XISFLib.Windows.Tests.csproj -c Release --no-build
      - run: dotnet pack .\XISFLib\XISFLib.csproj -c Release --no-build --output .\artifacts
      - run: dotnet list .\XISFLib.Net.slnx package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts\*.*nupkg