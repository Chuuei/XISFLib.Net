name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore .\XISFLib.Net.slnx
      - run: dotnet build .\XISFLib.Net.slnx -c Release --no-restore
      - run: dotnet test .\XISFLib.Tests\XISFLib.Tests.csproj -c Release --no-build
      - run: dotnet test .\XISFLib.Windows.Tests\XISFLib.Windows.Tests.csproj -c Release --no-build
      - run: dotnet test .\XISFLib.Viewer.Core.Tests\XISFLib.Viewer.Core.Tests.csproj -c Release --no-build
      - run: dotnet test .\XISFLib.AvaloniaViewer.Tests\XISFLib.AvaloniaViewer.Tests.csproj -c Release --no-build
      - run: dotnet pack .\XISFLib\XISFLib.csproj -c Release --no-build --output .\artifacts
      - run: dotnet list .\XISFLib.Net.slnx package --vulnerable --include-transitive
      - name: Publish standalone WPF viewer
        run: dotnet publish .\XISFLib.WpfViewer\XISFLib.WpfViewer.csproj -c Release -p:PublishProfile=WinX64
      - name: Verify single executable
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\artifacts\wpf\win-x64 -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'XISFLib.WpfViewer.exe') {
            throw 'The WPF publish output must contain exactly XISFLib.WpfViewer.exe.'
          }
      - name: Upload standalone WPF viewer
        uses: actions/upload-artifact@v4
        with:
          name: wpf-viewer-win-x64
          path: artifacts/wpf/win-x64/XISFLib.WpfViewer.exe
          if-no-files-found: error
      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.81.0
      - name: Build documentation
        run: docfx docfx.json --warningsAsErrors
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_site
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts\*.*nupkg

  portable-viewer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfontconfig1 libx11-6 libice6 libsm6 libxrender1 libxi6 libglib2.0-0 libfreetype6 libgomp1
      - run: dotnet test XISFLib.Tests/XISFLib.Tests.csproj -c Release
      - run: dotnet test XISFLib.Viewer.Core.Tests/XISFLib.Viewer.Core.Tests.csproj -c Release
      - run: dotnet test XISFLib.AvaloniaViewer.Tests/XISFLib.AvaloniaViewer.Tests.csproj -c Release
      - name: Publish standalone Avalonia viewer
        run: dotnet publish XISFLib.AvaloniaViewer/XISFLib.AvaloniaViewer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=embedded -p:PublishDocumentationFile=false -p:PublishReferencesDocumentationFiles=false -o artifacts/avalonia/${{ matrix.rid }}
      - name: Verify standalone executable
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/avalonia/${{ matrix.rid }} -Recurse -File)
          $expected = if ($IsWindows) { 'XISFLib.AvaloniaViewer.exe' } else { 'XISFLib.AvaloniaViewer' }
          if ($files.Count -ne 1 -or $files[0].Name -ne $expected) { throw 'Avalonia output must contain exactly one executable.' }
      - name: Windows native publication smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath artifacts/avalonia/win-x64/XISFLib.AvaloniaViewer.exe -ArgumentList '--smoke-test', 'artifacts/avalonia-smoke/report.json' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Native viewer smoke timed out.' }
          if ($process.ExitCode -ne 0) { throw 'Native viewer smoke failed.' }
      - name: Linux native publication smoke
        if: runner.os == 'Linux'
        run: timeout 60s xvfb-run -a artifacts/avalonia/linux-x64/XISFLib.AvaloniaViewer --smoke-test artifacts/avalonia-smoke/report.json
      - name: macOS native publication smoke
        if: runner.os == 'macOS'
        run: artifacts/avalonia/osx-arm64/XISFLib.AvaloniaViewer --smoke-test artifacts/avalonia-smoke/report.json
        timeout-minutes: 2
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-smoke-${{ matrix.rid }}
          path: artifacts/avalonia-smoke
          if-no-files-found: warn
      - name: Archive standalone viewer
        shell: pwsh
        run: Compress-Archive -Path artifacts/avalonia/${{ matrix.rid }}/* -DestinationPath artifacts/XISFLib.AvaloniaViewer-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-viewer-${{ matrix.rid }}
          path: artifacts/XISFLib.AvaloniaViewer-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-test-pack, portable-viewer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download standalone WPF viewer
        uses: actions/download-artifact@v4
        with:
          name: wpf-viewer-win-x64
          path: release
      - name: Download standalone Avalonia viewers
        uses: actions/download-artifact@v4
        with:
          pattern: avalonia-viewer-*
          merge-multiple: true
          path: release
      - name: Create release and upload viewers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(release/XISFLib.WpfViewer.exe release/XISFLib.AvaloniaViewer-*.zip)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
          fi

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
